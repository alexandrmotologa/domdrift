<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <clipPath id="squircle-clip">
      <rect x="24" y="24" width="976" height="976" rx="220" />
    </clipPath>

    <linearGradient id="emerald-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="facet-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <linearGradient id="facet-mid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <linearGradient id="facet-dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="facet-deep" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <filter id="subtle-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.14" />
    </filter>
  </defs>

  <!-- Luxury White Squircle Container -->
  <rect x="24" y="24" width="976" height="976" rx="220" fill="#ffffff" stroke="#e2e8f0" stroke-width="6" />

  <g clip-path="url(#squircle-clip)">
    <g transform="translate(512, 512)" filter="url(#subtle-shadow)">

      <!-- Hexagonal Architectural Gateway Frame -->
      <polygon points="
        0,-395
        342,-198
        342,198
        0,395
        -342,198
        -342,-198
      " fill="none" stroke="#0f172a" stroke-width="36" stroke-linejoin="round" />

      <polygon points="
        0,-360
        310,-179
        310,179
        0,360
        -310,179
        -310,-179
      " fill="none" stroke="url(#emerald-glow)" stroke-width="5" opacity="0.45" stroke-dasharray="18, 14" />

      <!-- Symmetrical Origami Mascot: The Adaptive Chameleon / Optical Raptor -->
      <!-- 1. Watertight Solid Base Silhouette -->
      <path d="
        M 0,-330
        L 95,-285
        L 185,-190
        L 230,-70
        L 245,70
        L 215,190
        L 140,290
        L 0,335
        L -140,290
        L -215,190
        L -245,70
        L -230,-70
        L -185,-190
        L -95,-285
        Z
      " fill="#0b0f19" />

      <!-- 2. Volumetric Low-Poly Crest Facets (Top Helmet/Crown) -->
      <!-- Center Forehead Keystones -->
      <polygon points="0,-330 95,-285 0,-210" fill="url(#facet-light)" />
      <polygon points="0,-330 -95,-285 0,-210" fill="url(#facet-mid)" />

      <!-- Lateral Crest Horns / Armor Spines -->
      <polygon points="95,-285 185,-190 85,-180" fill="url(#facet-mid)" />
      <polygon points="-95,-285 -185,-190 -85,-180" fill="url(#facet-dark)" />

      <polygon points="95,-285 85,-180 0,-210" fill="url(#facet-light)" />
      <polygon points="-95,-285 -85,-180 0,-210" fill="url(#facet-dark)" />

      <!-- Mid Forehead Diamond (Central Neural Node) -->
      <polygon points="0,-210 85,-180 0,-115" fill="url(#facet-mid)" />
      <polygon points="0,-210 -85,-180 0,-115" fill="url(#facet-dark)" />

      <!-- 3. Dual Binocular Visual Grounding Optics (Telescopic Chameleon Apertures) -->
      <!-- Right Orbital Socket Facets -->
      <polygon points="185,-190 230,-70 145,-75" fill="url(#facet-mid)" />
      <polygon points="185,-190 145,-75 85,-180" fill="url(#facet-light)" />
      <polygon points="85,-180 145,-75 0,-115" fill="url(#facet-light)" />

      <!-- Left Orbital Socket Facets -->
      <polygon points="-185,-190 -230,-70 -145,-75" fill="url(#facet-deep)" />
      <polygon points="-185,-190 -145,-75 -85,-180" fill="url(#facet-dark)" />
      <polygon points="-85,-180 -145,-75 0,-115" fill="url(#facet-dark)" />

      <!-- Right Eye Outer Turret Hexagon -->
      <polygon points="
        145,-120
        195,-92
        195,-38
        145,-10
        95,-38
        95,-92
      " fill="#0f172a" stroke="#22c55e" stroke-width="4" />

      <!-- Right Eye Optical Iris (Concentric Tier Ring) -->
      <circle cx="145" cy="-65" r="32" fill="#0b0f19" stroke="#00f5ff" stroke-width="3" />
      <circle cx="145" cy="-65" r="20" fill="url(#emerald-glow)" />
      <polygon points="145,-78 152,-65 145,-52 138,-65" fill="#ffffff" />

      <!-- Left Eye Outer Turret Hexagon -->
      <polygon points="
        -145,-120
        -95,-92
        -95,-38
        -145,-10
        -195,-38
        -195,-92
      " fill="#090d16" stroke="#22c55e" stroke-width="4" />

      <!-- Left Eye Optical Iris (Concentric Tier Ring) -->
      <circle cx="-145" cy="-65" r="32" fill="#070a12" stroke="#00f5ff" stroke-width="3" />
      <circle cx="-145" cy="-65" r="20" fill="url(#emerald-glow)" />
      <polygon points="-145,-78 -138,-65 -145,-52 -152,-65" fill="#ffffff" />

      <!-- 4. Bridge of Muzzle and Nose Facets -->
      <polygon points="0,-115 65,-25 0,35" fill="url(#facet-light)" />
      <polygon points="0,-115 -65,-25 0,35" fill="url(#facet-mid)" />

      <!-- Sub-orbital Cheek Flanges -->
      <polygon points="145,-75 245,70 135,55" fill="url(#facet-mid)" />
      <polygon points="145,-75 135,55 65,-25" fill="url(#facet-light)" />

      <polygon points="-145,-75 -245,70 -135,55" fill="url(#facet-deep)" />
      <polygon points="-145,-75 -135,55 -65,-25" fill="url(#facet-dark)" />

      <!-- 5. Aerodynamic Lower Muzzle & Jaws (Zero Buck Teeth) -->
      <polygon points="65,-25 135,55 0,110" fill="url(#facet-light)" />
      <polygon points="-65,-25 -135,55 0,110" fill="url(#facet-mid)" />
      <polygon points="0,35 65,-25 0,110" fill="url(#facet-mid)" />
      <polygon points="0,35 -65,-25 0,110" fill="url(#facet-dark)" />

      <!-- Jaw Line Strike Plates -->
      <polygon points="135,55 245,70 215,190" fill="url(#facet-mid)" />
      <polygon points="135,55 215,190 115,175" fill="url(#facet-light)" />
      <polygon points="135,55 115,175 0,110" fill="url(#facet-mid)" />

      <polygon points="-135,55 -245,70 -215,190" fill="url(#facet-deep)" />
      <polygon points="-135,55 -215,190 -115,175" fill="url(#facet-dark)" />
      <polygon points="-135,55 -115,175 0,110" fill="url(#facet-dark)" />

      <!-- 6. Mandible & Throat Armor Plates -->
      <polygon points="0,110 115,175 0,225" fill="url(#facet-light)" />
      <polygon points="0,110 -115,175 0,225" fill="url(#facet-dark)" />

      <polygon points="115,175 215,190 140,290" fill="url(#facet-mid)" />
      <polygon points="115,175 140,290 0,225" fill="url(#facet-light)" />

      <polygon points="-115,175 -215,190 -140,290" fill="url(#facet-deep)" />
      <polygon points="-115,175 -140,290 0,225" fill="url(#facet-dark)" />

      <!-- Lower Anchor V-Keel (Target Vector) -->
      <polygon points="0,225 140,290 0,335" fill="url(#facet-mid)" />
      <polygon points="0,225 -140,290 0,335" fill="url(#facet-deep)" />

      <!-- Central Electric Energy Seams (Subtle Precision Accents) -->
      <line x1="0" y1="-330" x2="0" y2="-115" stroke="#22c55e" stroke-width="3" opacity="0.75" />
      <line x1="0" y1="35" x2="0" y2="335" stroke="#22c55e" stroke-width="3" opacity="0.75" />

    </g>
  </g>
</svg>